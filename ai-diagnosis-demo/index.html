  <script>
    // 🆕 V2.0.9 改 fetch → 同步 XHR：保证 window.__PRD__ 在 React 渲染前就绪
    window.__PRD__ = { status_meta: null, disease_library: null, rules: null, tips: null };
    try {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', './js/prd_data.json', false); // false = 同步
      xhr.send(null);
      if (xhr.status === 200) {
        const d = JSON.parse(xhr.responseText);
        window.__PRD__ = d;
        console.log('✅ V2.0.9 PRD data loaded synchronously from JSON', d);
        const update = () => {
          const el = document.getElementById('prd-data-status');
          if (el) el.textContent = `📦 JSON: ${d.version} ✅`;
        };
        [100, 500, 1000, 2000, 3000].forEach(t => setTimeout(update, t));
      } else {
        throw new Error('xhr status ' + xhr.status);
      }
    } catch (e) {
      console.warn('⚠️ PRD JSON fetch failed, using hardcoded fallback (V2.0.9):', e.message);
      const update = () => {
        const el = document.getElementById('prd-data-status');
        if (el) el.textContent = '📦 JSON: fallback (硬编码)';
      };
      [100, 500, 1000, 2000, 3000].forEach(t => setTimeout(update, t));
    }
  </script>

    // 🆕 V2.3.0 getPrd 增强：支持 status_meta 自动合并 fallback（保证 fallback 的所有 code 都生效）
    const getPrd = (path, fallback) => {
      if (typeof window === 'undefined' || !window.__PRD__) return fallback;
      const keys = path.split('.');
      let cur = window.__PRD__;
      for (const k of keys) {
        if (cur && typeof cur === 'object' && k in cur && cur[k] !== null && cur[k] !== undefined) {
          cur = cur[k];
        } else {
          return fallback;
        }
      }
      // 🆕 V2.3.0：如果是 status_meta 路径且有 fallback，合并 JSON + fallback（fallback 优先缺失的 code）
      if (path === 'status_meta' && fallback && typeof cur === 'object') {

      }
      return cur;

                <div>
                  <div className="text-lg font-bold">张某 · 58 岁 · 男</div>
                  <div className="text-sm text-gray-500 mt-1">门诊号 202608270008 · 内科张文华医生</div>
                </div>
                <div className="text-xs px-3 py-1 bg-status-red/10 text-status-red rounded-full">🔴 危急值</div>
              </div>
            </Card>

            {/* 危急值详情 */}
            <Card>
              <div className="text-sm font-medium mb-3">📊 危急值详情</div>
              <div className="bg-status-red/5 border border-status-red/20 rounded-lg p-4">
                <div className="text-2xl font-bold text-status-red">血钾 6.8 mmol/L</div>
                <div className="text-sm text-gray-600 mt-1">正常参考值：3.5 - 5.5 mmol/L</div>
                <div className="text-sm text-status-red mt-2 font-medium">⚠️ 超出正常上限 23.6%，可能引发心律失常</div>
              </div>
            </Card>

            {/* 4 通道推送状态 */}
            <Card>
              <div id="tip-13" className="text-sm font-medium mb-3 flex items-center">📡 4 通道强推状态
                <Tip>为什么 4 通道（红点/App/短信/大屏）？医生可能在手术/查房/午休，单通道漏看就是人命（PRD §9.5 D13）</Tip>
              </div>
              <div className="grid grid-cols-4 gap-3">
                {[
                  { name: '工作台红点', time: '立即' },
                  { name: 'App Push', time: '12s' },
                  { name: '短信', time: '34s' },
                  { name: '诊所大屏', time: '48s' },
                ].map((c, i) => (
                  <div key={i} className="border border-status-green/30 bg-status-green/5 rounded-lg p-3 text-center">
                    <div className="text-status-green text-xl">✅</div>
                    <div className="text-xs mt-1 font-medium">{c.name}</div>
                    <div className="text-xs text-gray-500">已送达 {c.time}</div>
                  </div>
                ))}
              </div>
            </Card>

            {/* 处置建议 */}
            <Card>
              <div className="text-sm font-medium mb-3">💊 AI 处置建议</div>
              <ul className="text-sm space-y-2 text-gray-700">
                <li>① 立即复查血气 + 心电图</li>
                <li>② 静脉注射 10% 葡萄糖酸钙 10-20ml</li>
                <li>③ 胰岛素 + 葡萄糖降钾</li>
                <li>④ 评估是否急诊透析</li>
              </ul>
            </Card>

            {/* 已读按钮 */}
            {!read ? (
              <span id="tip-14" className="inline-block w-full">
                <button onClick={() => setRead(true)} className="w-full bg-status-red text-white rounded-xl py-4 font-bold text-lg">
                  ✅ 我已知悉，立即处置
                </button>
                <Tip>为什么 30 分钟强制？临床数据——危急值平均 30 分钟内未处理死亡风险倍增（PRD §9.5 D14）</Tip>
              </span>
            ) : (
              <div className="bg-status-green/10 border border-status-green/30 rounded-xl p-4 text-center">
                <div className="text-status-green font-bold">✅ 已读确认 · 09:30:15</div>
                <div className="text-xs text-gray-500 mt-1">已通知院长 · 处置中</div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ========== 路由 ==========
    const App = () => {
      const [hash, setHash] = useState(location.hash || '#/login');
      // 🆕 V2.2.0 左抽屉开关状态（App 顶层 + LeftPanel 同步）
      const [leftPanelOpen, setLeftPanelOpen] = useState(true);

      useEffect(() => {
        const handler = () => setHash(location.hash || '#/login');
        window.addEventListener('hashchange', handler);
        return () => window.removeEventListener('hashchange', handler);
      }, []);

      // 🆕 V2.0.5 全局 LeftPanel 包裹（不渲染在 login 页）
      // 路由匹配（V2.0 增 P-2 预诊 / P-1 追问 / P0 挂号 / P0.5 危急值）
      let page;
      if (hash === '#/login' || hash === '' || hash === '#/') page = <LoginPage />;
      else if (hash === '#/pre-diagnosis' || hash === '#/pre-diagnosis/index') page = <PreDiagnosisPage />;
      else if (hash === '#/pre-diagnosis/chat') page = <PreDiagnosisChatPage />;
      else if (hash === '#/register') page = <RegisterPage />;
      else if (hash === '#/dashboard') page = <DashboardPage />;
      else if (hash === '#/emr/new' || hash === '#/emr/ai-result' || hash === '#/prescription') page = <EMREditPage />;
      else if (hash === '#/critical/1') page = <CriticalValuePage />;
      else if (hash === '#/followup-config') page = <FollowupConfigPage />;
      else if (hash === '#/followup') page = <FollowupPage />;
      else if (hash.startsWith('#/followup/patient/')) page = <RiskDetailPage />;
      else if (hash === '#/stats') page = <StatsPage />;
      else if (hash === '#/demo/error') page = <ErrorDemoPage />;
      else page = (
        <div className="min-h-screen flex items-center justify-center">
          <div className="text-center">
            <div className="text-4xl mb-3">404</div>
            <div className="text-gray-500 mb-4">页面不存在</div>
            <Button onClick={() => location.hash = '#/dashboard'}>返回工作台</Button>
          </div>
        </div>
      );

      // 🆕 V2.0.5 Login 页不显示 LeftPanel（避免遮挡手机壳 UI）
      if (hash === '#/login' || hash === '' || hash === '#/') return page;

      return (
        <div className="flex">
          <LeftPanel currentPath={hash} open={leftPanelOpen} setOpen={setLeftPanelOpen} />
          {/* 🆕 V2.2.0 改 1：main 边距随抽屉状态自适应（240 / 0）*/}
          <div className="flex-1" style={{ marginLeft: leftPanelOpen ? 240 : 0, transition: 'margin-left 0.2s' }}>{page}</div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
